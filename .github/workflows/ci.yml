name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # TypeScript MCP Server
  ts-lint:
    name: TypeScript Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript build
        run: npm run build

      - name: Run ESLint
        run: npm run lint || true

  ts-test:
    name: TypeScript Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || true

  # Python MCP Server (legacy) - non-blocking during TypeScript migration
  py-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check if Python files exist
        id: check_python
        run: |
          if [ -d "src" ] && [ "$(find src -name '*.py' 2>/dev/null | head -1)" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.check_python.outputs.has_python == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        if: steps.check_python.outputs.has_python == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.check_python.outputs.has_python == 'true'
        run: uv sync --dev

      - name: Run ruff linter
        if: steps.check_python.outputs.has_python == 'true'
        run: uv run ruff check src/ tests/

      - name: Run ruff formatter check
        if: steps.check_python.outputs.has_python == 'true'
        run: uv run ruff format --check src/ tests/

      - name: Run mypy type checker
        if: steps.check_python.outputs.has_python == 'true'
        run: uv run mypy src/

      - name: Skip Python checks
        if: steps.check_python.outputs.has_python == 'false'
        run: echo "No Python source files found, skipping Python checks"

  py-test:
    name: Python Test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Check if Python files exist
        id: check_python
        run: |
          if [ -d "src" ] && [ "$(find src -name '*.py' 2>/dev/null | head -1)" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.check_python.outputs.has_python == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        if: steps.check_python.outputs.has_python == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.check_python.outputs.has_python == 'true'
        run: uv sync --dev

      - name: Run tests
        if: steps.check_python.outputs.has_python == 'true'
        run: uv run pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        if: steps.check_python.outputs.has_python == 'true'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Skip Python tests
        if: steps.check_python.outputs.has_python == 'false'
        run: echo "No Python source files found, skipping Python tests"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if Python files exist
        id: check_python
        run: |
          if [ -d "src" ] && [ "$(find src -name '*.py' 2>/dev/null | head -1)" ]; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          else
            echo "has_python=false" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.check_python.outputs.has_python == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        if: steps.check_python.outputs.has_python == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.check_python.outputs.has_python == 'true'
        run: uv sync --dev

      - name: Run bandit security scan
        if: steps.check_python.outputs.has_python == 'true'
        run: uv run bandit -r src/ -ll
        continue-on-error: true

      - name: Skip security scan
        if: steps.check_python.outputs.has_python == 'false'
        run: echo "No Python source files found, skipping security scan"
