name: Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: "20"

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts-mcp
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts-mcp/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload build artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: ts-mcp/dist/**/*.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
